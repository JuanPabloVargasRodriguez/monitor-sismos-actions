name: Monitor de sismos - CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI - Validar y generar
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar pruebas automáticas (sin internet)
        run: python -m unittest discover -v

      - name: Descargar el CSV actualizado del USGS
        run: python descargar.py

      - name: Generar informe HTML
        run: python analizar.py

      - name: Preparar informe para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  cd:
    name: CD - Publicar en Pages
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar informe
        id: deployment
        uses: actions/deploy-pages@v4
